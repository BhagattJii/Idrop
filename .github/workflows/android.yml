name: Android CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK packages
        run: |
          set -e
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -maxdepth 3 -name sdkmanager -type f | head -n 1)"
          echo "Using $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Prepare release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.IDROP_KEYSTORE_BASE64 }}
        run: |
          set -e
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/idrop-release.jks"
            test -s "$RUNNER_TEMP/idrop-release.jks"
            echo "SIGNING=true" >> "$GITHUB_ENV"
            echo "Release keystore decoded."
          else
            echo "SIGNING=false" >> "$GITHUB_ENV"
            echo "No release keystore secret configured; release APK will be unsigned."
          fi

      - name: Build release APK
        env:
          IDROP_KEYSTORE_PATH: ${{ runner.temp }}/idrop-release.jks
          IDROP_KEYSTORE_PASSWORD: ${{ secrets.IDROP_KEYSTORE_PASSWORD }}
          IDROP_KEY_ALIAS: ${{ secrets.IDROP_KEY_ALIAS }}
          IDROP_KEY_PASSWORD: ${{ secrets.IDROP_KEY_PASSWORD }}
        run: |
          set -e
          if [ "$SIGNING" = "true" ]; then
            ./gradlew assembleRelease --stacktrace
          else
            echo "Skipping signed release build."
          fi

      - name: Verify release signature
        if: env.SIGNING == 'true'
        run: |
          set -e
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort | tail -n 1)"
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/release/app-release.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: idrop-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload release APK
        if: env.SIGNING == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: idrop-release
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v') && env.SIGNING == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          APK="app/build/outputs/apk/release/app-release.apk"
          test -f "$APK"
          ASSET="iDrop-$GITHUB_REF_NAME.apk"
          cp "$APK" "$ASSET"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$ASSET" --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              "$ASSET" \
              --title "iDrop $GITHUB_REF_NAME" \
              --generate-notes \
              --verify-tag
          fi
