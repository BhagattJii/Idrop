name: Build APK

permissions:
  contents: write

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build debug & signed release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17 (for sdkmanager only)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept licenses & install Android SDK components
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-30" "build-tools;30.0.3" "platform-tools" > /dev/null
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"

      - name: Set up JDK 11 (for Gradle build)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: Decode release keystore
        env:
          KEYSTORE_B64: ${{ secrets.IDROP_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > app/release.keystore
          fi

      - name: Grant execute to gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew :app:assembleFossReliantDebug --stacktrace

      - name: Build release APK
        run: ./gradlew :app:assembleFossReliantRelease --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: iDrop-debug-apk
          path: app/build/outputs/apk/fossReliant/debug/*.apk

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: iDrop-release-apk
          path: app/build/outputs/apk/fossReliant/release/*.apk

      - name: Attach APKs to GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/fossReliant/debug/*.apk
            app/build/outputs/apk/fossReliant/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
